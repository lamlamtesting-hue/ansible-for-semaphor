---
- name: Create a Host in Icinga Director
  hosts: localhost
  gather_facts: false
  vars:
    director_url: "http://10.1.5.151:8080/"
    host_name: "web-server-google-02"
    host_ip: "8.8.8.8"

  tasks:
    # Director: POST /director/host creates. PUT/POST with ?name= only works
    # if the object already exists (otherwise 404 "No such object available").
    - name: Create generic-host template in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: generic-host
          object_type: template
          check_command: hostalive
          max_check_attempts: 3
          check_interval: 1m
          retry_interval: 30s
        status_code: [201, 500]
      register: generic_host_template
      failed_when:
        - generic_host_template.status != 201
        - "'Trying to recreate' not in (generic_host_template.json.error | default(''))"

    - name: Create host object via Director API
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ host_name }}"
          object_type: object
          address: "{{ host_ip }}"
          imports:
            - generic-host
          vars:
            os: Linux
        status_code: [201, 500]
      register: director_host
      failed_when:
        - director_host.status != 201
        - "'Trying to recreate' not in (director_host.json.error | default(''))"

    - name: Deploy Director config to Icinga 2
      ansible.builtin.uri:
        url: "{{ director_url }}/director/config/deploy"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        status_code: [200, 201]