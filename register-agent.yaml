---
- name: Register an Icinga 2 Agent host in Director
  hosts: localhost
  gather_facts: false
  vars:
    director_url: "http://10.1.5.151:8080"
    host_name: "lamtest-agent-01"
    # host_ip: "172.21.42.206"
    # Matches Director UI: Icinga Agent and zone settings
    # Cluster Zone / Icinga2 Agent / Establish connection / Accepts config
    cluster_zone: master
    has_agent: "y"
    master_should_connect: "y"
    accept_config: "y"
    # Endpoint CN inside Icinga (docker-compose hostname)
    icinga_master_cn: icinga2
    # Address the VM uses to reach published 5665. Override in Semaphore extra vars.
    icinga_master_host: "10.1.5.151"
    icinga_master_port: 5665
    generic_host_template_name: generic-host-lam
    icinga_agent_template_name: icinga-agent-lam

  tasks:
    - name: Create {{ generic_host_template_name }} template in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ generic_host_template_name }}"
          object_type: template
          check_command: hostalive
          max_check_attempts: 3
          check_interval: 1m
          retry_interval: 30s
        status_code: [201, 500]
      register: generic_host_template
      failed_when:
        - generic_host_template.status != 201
        - "'Trying to recreate' not in (generic_host_template.json.error | default(''))"

    # Agent flags belong on a template. POST create is skipped if it already
    # exists, so the next task always writes has_agent=y onto the template.
    - name: Create {{ icinga_agent_template_name }} template in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ icinga_agent_template_name }}"
          object_type: template
          imports:
            - "{{ generic_host_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [201, 500]
      register: agent_template
      failed_when:
        - agent_template.status != 201
        - "'Trying to recreate' not in (agent_template.json.error | default(''))"

    - name: Set agent flags on {{ icinga_agent_template_name }} template
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ icinga_agent_template_name }}"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          imports:
            - "{{ generic_host_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [200, 304]

    - name: Check if host already exists in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ host_name }}"
        method: GET
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        status_code: [200, 404]
      register: existing_host

    - name: Create agent host in Director
      when: existing_host.status == 404
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ host_name }}"
          object_type: object
          address: "{{ host_ip }}"
          imports:
            - "{{ icinga_agent_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
          vars:
            os: Linux
        status_code: [201]

    - name: Attach {{ icinga_agent_template_name }} template to existing host
      when: existing_host.status == 200
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ host_name }}"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          address: "{{ host_ip }}"
          imports:
            - "{{ icinga_agent_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [200, 304]

    - name: Deploy Director config to Icinga 2
      ansible.builtin.uri:
        url: "{{ director_url }}/director/config/deploy"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        status_code: [200, 201]

    - name: Fetch agent ticket from Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host/ticket?name={{ host_name }}"
        method: GET
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        return_content: true
        status_code: [200]
      register: agent_ticket

    - name: Show agent ticket for node wizard
      ansible.builtin.debug:
        msg: "Agent ticket for {{ host_name }}: {{ agent_ticket.json }}"

