---
- name: Register agents in Director and build WinRM inventory
  hosts: localhost
  gather_facts: false
  vars:
    director_url: "http://10.1.5.151:8080"
    # Semaphore Extra variables JSON.
    # Cluster Zone in Director: master | LC-icinga-slave01 | lc-satellites
# {
#   "icinga_master_cn": "icinga2",
#   "cluster_zone": "master",
#   "icinga_agent_hosts": [
#     { "host_ip": "10.1.5.10", "cn": "win-agent-01", "cluster_zone": "master", "agent_winrm_user": "Administrator", "agent_winrm_pass": "pass-a" },
#     { "host_ip": "10.1.5.11", "cn": "win-agent-02", "cluster_zone": "LC-icinga-slave01", "icinga_master_cn": "LC-icinga-slave01", "agent_winrm_user": "otheradmin", "agent_winrm_pass": "pass-b" },
#     { "host_ip": "10.1.5.12", "cn": "win-agent-03", "cluster_zone": "lc-satellites", "agent_winrm_user": "Administrator", "agent_winrm_pass": "pass-c" }
#   ]
# }
    has_agent: "y"
    master_should_connect: "y"
    accept_config: "y"
    icinga_master_host: "10.1.5.151"
    icinga_master_port: 5665
    generic_host_template_name: generic-host-lam
    icinga_agent_template_name: icinga-agent-lam
    agent_winrm_port: 5985
    agent_winrm_scheme: http
    agent_winrm_transport: ntlm
    agent_winrm_server_cert_validation: ignore
    # agent_winrm_user: Administrator
    # agent_winrm_pass: ""

  tasks:
    - name: Normalize agent host list
      ansible.builtin.set_fact:
        agent_hosts: "{{ (icinga_agent_hosts | from_json) if (icinga_agent_hosts is defined and icinga_agent_hosts is string) else (icinga_agent_hosts | default([{'host_ip': host_ip, 'cn': cn}])) }}"

    - name: Require icinga_master_cn from extra vars
      ansible.builtin.assert:
        that:
          - icinga_master_cn is defined
          - icinga_master_cn | length > 0
        fail_msg: Set icinga_master_cn in Semaphore extra vars JSON (parent Endpoint CN).

    - name: Require host_ip and cn on every agent
      ansible.builtin.assert:
        that:
          - item.host_ip is defined
          - item.host_ip | length > 0
          - (item.cn | default(item.host_name | default('')) | length > 0)
          - (item.cluster_zone | default(cluster_zone | default('')) | length > 0)
          - (item.agent_winrm_user | default(agent_winrm_user | default('')) | length > 0)
          - (item.agent_winrm_pass | default(agent_winrm_pass | default('')) | length > 0)
        fail_msg: Each agent needs host_ip, cn, cluster_zone, and WinRM user/pass (per host or top-level default).
      loop: "{{ agent_hosts }}"
      loop_control:
        label: "{{ item.host_ip | default('missing host_ip') }}"

    - name: Build agent list with cn
      ansible.builtin.set_fact:
        agent_hosts_named: "{{ agent_hosts_named | default([]) + [item | combine({'cn': (item.cn | default(item.host_name | default('')) | trim), 'cluster_zone': (item.cluster_zone | default(cluster_zone))})] }}"
      loop: "{{ agent_hosts }}"
      loop_control:
        label: "{{ item.host_ip }} / {{ item.cn | default(item.host_name | default('missing cn')) }}"

    - name: Use named agent host list
      ansible.builtin.set_fact:
        agent_hosts: "{{ agent_hosts_named }}"

    - name: Require unique host_ip and cn
      ansible.builtin.assert:
        that:
          - (agent_hosts | map(attribute='host_ip') | list | length) == (agent_hosts | map(attribute='host_ip') | unique | list | length)
          - (agent_hosts | map(attribute='cn') | list | length) == (agent_hosts | map(attribute='cn') | unique | list | length)
        fail_msg: >-
          Each agent needs a different host_ip and a different cn.
          IPs: {{ agent_hosts | map(attribute='host_ip') | list }}
          CNs: {{ agent_hosts | map(attribute='cn') | list }}

    - name: Create {{ generic_host_template_name }} template in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ generic_host_template_name }}"
          object_type: template
          check_command: hostalive
          max_check_attempts: 3
          check_interval: 1m
          retry_interval: 30s
        status_code: [201, 500]
      register: generic_host_template
      failed_when:
        - generic_host_template.status != 201
        - "'Trying to recreate' not in (generic_host_template.json.error | default(''))"

    # Agent flags belong on a template. POST create is skipped if it already
    # exists, so the next task always writes has_agent=y onto the template.
    - name: Create {{ icinga_agent_template_name }} template in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ icinga_agent_template_name }}"
          object_type: template
          imports:
            - "{{ generic_host_template_name }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [201, 500]
      register: agent_template
      failed_when:
        - agent_template.status != 201
        - "'Trying to recreate' not in (agent_template.json.error | default(''))"

    - name: Set agent flags on {{ icinga_agent_template_name }} template
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ icinga_agent_template_name }}"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          imports:
            - "{{ generic_host_template_name }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [200, 304]

    - name: Check if host already exists in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ item.cn }}"
        method: GET
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        status_code: [200, 404]
      loop: "{{ agent_hosts }}"
      loop_control:
        label: "{{ item.cn }} ({{ item.host_ip }})"
      register: existing_hosts

    - name: Create agent host in Director
      when: item.status == 404
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ item.item.cn }}"
          object_type: object
          address: "{{ item.item.host_ip }}"
          imports:
            - "{{ icinga_agent_template_name }}"
          zone: "{{ item.item.cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
          vars:
            os: Windows
        status_code: [201]
      loop: "{{ existing_hosts.results }}"
      loop_control:
        label: "{{ item.item.cn }} ({{ item.item.host_ip }})"

    - name: Attach {{ icinga_agent_template_name }} template to existing host
      when: item.status == 200
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ item.item.cn }}"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          address: "{{ item.item.host_ip }}"
          imports:
            - "{{ icinga_agent_template_name }}"
          zone: "{{ item.item.cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [200, 304]
      loop: "{{ existing_hosts.results }}"
      loop_control:
        label: "{{ item.item.cn }} ({{ item.item.host_ip }})"

    - name: Deploy Director config to Icinga 2
      ansible.builtin.uri:
        url: "{{ director_url }}/director/config/deploy"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        status_code: [200, 201]

    - name: Fetch agent ticket from Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host/ticket?name={{ item.cn }}"
        method: GET
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        return_content: true
        status_code: [200]
      loop: "{{ agent_hosts }}"
      loop_control:
        label: "{{ item.cn }}"
      register: agent_tickets

    - name: Show agent ticket for node wizard
      ansible.builtin.debug:
        msg: "Agent ticket for {{ item.item.cn }} ({{ item.item.host_ip }}): {{ item.json }}"
      loop: "{{ agent_tickets.results }}"
      loop_control:
        label: "{{ item.item.cn }}"

    - name: Add target VMs to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.item.cn }}"
        ansible_host: "{{ item.item.host_ip }}"
        ansible_connection: winrm
        ansible_port: "{{ item.item.agent_winrm_port | default(agent_winrm_port) }}"
        ansible_user: "{{ item.item.agent_winrm_user | default(agent_winrm_user) }}"
        ansible_password: "{{ item.item.agent_winrm_pass | default(agent_winrm_pass) }}"
        ansible_winrm_transport: "{{ agent_winrm_transport }}"
        ansible_winrm_server_cert_validation: "{{ agent_winrm_server_cert_validation }}"
        ansible_winrm_scheme: "{{ item.item.agent_winrm_scheme | default(agent_winrm_scheme) }}"
        groups: icinga_agents
        icinga_host_name: "{{ item.item.cn }}"
        icinga_ticket: "{{ item.json }}"
        cluster_zone: "{{ item.item.cluster_zone }}"
        master_should_connect: "{{ master_should_connect }}"
        icinga_master_cn: "{{ item.item.icinga_master_cn | default(icinga_master_cn) }}"
        icinga_master_host: "{{ item.item.icinga_master_host | default(icinga_master_host) }}"
        icinga_master_port: "{{ icinga_master_port }}"
      loop: "{{ agent_tickets.results }}"
      loop_control:
        label: "{{ item.item.cn }} ({{ item.item.host_ip }})"

- name: Install Icinga 2 agent on the target VMs
  hosts: icinga_agents
  gather_facts: true
  vars:
    icinga2_exe: 'C:\Program Files\ICINGA2\sbin\icinga2.exe'
    icinga_cert_dir: 'C:\ProgramData\icinga2\var\lib\icinga2\certs'
    icinga2_msi_path: 'C:\Windows\Temp\icinga2.msi'
    icinga2_windows_msi_url: https://packages.icinga.com/windows/Icinga2-v2.16.5-x86_64.msi
    icinga_parent_endpoint: "{{ icinga_master_cn if master_should_connect == 'y' else (icinga_master_cn ~ ',' ~ icinga_master_host ~ ',' ~ icinga_master_port) }}"

  tasks:
    - name: Download Icinga 2 MSI
      ansible.windows.win_get_url:
        url: "{{ icinga2_windows_msi_url }}"
        dest: "{{ icinga2_msi_path }}"

    - name: Install Icinga 2
      ansible.windows.win_package:
        path: "{{ icinga2_msi_path }}"
        state: present
        arguments: /qn /norestart
        expected_return_code: [0, 3010]

    - name: Ensure certificate directory exists
      ansible.windows.win_file:
        path: "{{ icinga_cert_dir }}"
        state: directory

    - name: Fetch trusted certificate from Icinga master
      ansible.windows.win_command:
        argv:
          - "{{ icinga2_exe }}"
          - pki
          - save-cert
          - --host
          - "{{ icinga_master_host }}"
          - --port
          - "{{ icinga_master_port }}"
          - --trustedcert
          - "{{ icinga_cert_dir }}\\trusted-parent.crt"
        creates: "{{ icinga_cert_dir }}\\trusted-parent.crt"

    - name: Check if agent certificate already exists
      ansible.windows.win_stat:
        path: "{{ icinga_cert_dir }}\\{{ icinga_host_name }}.crt"
      register: agent_cert

    - name: Run icinga2 node setup with Director ticket
      when: not agent_cert.stat.exists
      ansible.windows.win_command:
        argv:
          - "{{ icinga2_exe }}"
          - node
          - setup
          - --ticket
          - "{{ icinga_ticket }}"
          - --cn
          - "{{ icinga_host_name }}"
          - --zone
          - "{{ icinga_host_name }}"
          - --endpoint
          - "{{ icinga_parent_endpoint }}"
          - --parent_host
          - "{{ icinga_master_host }}"
          - --parent_zone
          - "{{ cluster_zone }}"
          - --trustedcert
          - "{{ icinga_cert_dir }}\\trusted-parent.crt"
          - --accept-commands
          - --accept-config
          - --disable-confd
      notify: Restart icinga2

    - name: Enable and start icinga2
      ansible.windows.win_service:
        name: icinga2
        start_mode: auto
        state: started

  handlers:
    - name: Restart icinga2
      ansible.windows.win_service:
        name: icinga2
        state: restarted
