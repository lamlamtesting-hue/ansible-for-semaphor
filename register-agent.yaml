---
- name: Register an Icinga 2 Agent host in Director
  hosts: localhost
  gather_facts: false
  vars:
    director_url: "http://10.1.5.151:8080"
    host_name: "lamtest-agent-01"
    # host_ip: "172.21.42.206"
    # Matches Director UI: Icinga Agent and zone settings
    # Cluster Zone / Icinga2 Agent / Establish connection / Accepts config
    cluster_zone: master
    has_agent: "y"
    master_should_connect: "y"
    accept_config: "y"
    # Endpoint CN inside Icinga (docker-compose hostname)
    icinga_master_cn: icinga2
    # Address the VM uses to reach published 5665. Override in Semaphore extra vars.
    icinga_master_host: "10.1.5.151"
    icinga_master_port: 5665
    generic_host_template_name: generic-host-lam
    icinga_agent_template_name: icinga-agent-lam
    agent_winrm_port: 5985
    agent_winrm_scheme: http
    agent_winrm_transport: ntlm
    agent_winrm_server_cert_validation: ignore
    agent_winrm_user: Administrator
    agent_winrm_pass: ""

  tasks:
    - name: Create {{ generic_host_template_name }} template in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ generic_host_template_name }}"
          object_type: template
          check_command: hostalive
          max_check_attempts: 3
          check_interval: 1m
          retry_interval: 30s
        status_code: [201, 500]
      register: generic_host_template
      failed_when:
        - generic_host_template.status != 201
        - "'Trying to recreate' not in (generic_host_template.json.error | default(''))"

    # Agent flags belong on a template. POST create is skipped if it already
    # exists, so the next task always writes has_agent=y onto the template.
    - name: Create {{ icinga_agent_template_name }} template in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ icinga_agent_template_name }}"
          object_type: template
          imports:
            - "{{ generic_host_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [201, 500]
      register: agent_template
      failed_when:
        - agent_template.status != 201
        - "'Trying to recreate' not in (agent_template.json.error | default(''))"

    - name: Set agent flags on {{ icinga_agent_template_name }} template
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ icinga_agent_template_name }}"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          imports:
            - "{{ generic_host_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [200, 304]

    - name: Check if host already exists in Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ host_name }}"
        method: GET
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        status_code: [200, 404]
      register: existing_host

    - name: Create agent host in Director
      when: existing_host.status == 404
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          object_name: "{{ host_name }}"
          object_type: object
          address: "{{ host_ip }}"
          imports:
            - "{{ icinga_agent_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
          vars:
            os: Windows
        status_code: [201]

    - name: Attach {{ icinga_agent_template_name }} template to existing host
      when: existing_host.status == 200
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host?name={{ host_name }}"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        body_format: json
        body:
          address: "{{ host_ip }}"
          imports:
            - "{{ icinga_agent_template_name }}"
          zone: "{{ cluster_zone }}"
          has_agent: "{{ has_agent }}"
          master_should_connect: "{{ master_should_connect }}"
          accept_config: "{{ accept_config }}"
        status_code: [200, 304]

    - name: Deploy Director config to Icinga 2
      ansible.builtin.uri:
        url: "{{ director_url }}/director/config/deploy"
        method: POST
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        status_code: [200, 201]

    - name: Fetch agent ticket from Director
      ansible.builtin.uri:
        url: "{{ director_url }}/director/host/ticket?name={{ host_name }}"
        method: GET
        url_username: "{{ icinga_web_user }}"
        url_password: "{{ icinga_web_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: "application/json"
        return_content: true
        status_code: [200]
      register: agent_ticket

    - name: Show agent ticket for node wizard
      ansible.builtin.debug:
        msg: "Agent ticket for {{ host_name }}: {{ agent_ticket.json }}"

    - name: Add target VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ host_name }}"
        ansible_host: "{{ host_ip }}"
        ansible_connection: winrm
        ansible_port: "{{ agent_winrm_port }}"
        ansible_user: "{{ agent_winrm_user }}"
        ansible_password: "{{ agent_winrm_pass }}"
        ansible_winrm_transport: "{{ agent_winrm_transport }}"
        ansible_winrm_server_cert_validation: "{{ agent_winrm_server_cert_validation }}"
        ansible_winrm_scheme: "{{ agent_winrm_scheme }}"
        groups: icinga_agents
        icinga_ticket: "{{ agent_ticket.json }}"
        cluster_zone: "{{ cluster_zone }}"
        master_should_connect: "{{ master_should_connect }}"
        icinga_master_cn: "{{ icinga_master_cn }}"
        icinga_master_host: "{{ icinga_master_host }}"
        icinga_master_port: "{{ icinga_master_port }}"

- name: Install Icinga 2 agent on the target VM
  hosts: icinga_agents
  gather_facts: true
  vars:
    icinga2_exe: 'C:\Program Files\ICINGA2\sbin\icinga2.exe'
    icinga_cert_dir: 'C:\ProgramData\icinga2\var\lib\icinga2\certs'
    icinga2_msi_path: 'C:\Windows\Temp\icinga2.msi'
    icinga2_windows_msi_url: https://packages.icinga.com/windows/Icinga2-v2.16.5-x86_64.msi
    icinga_parent_endpoint: "{{ icinga_master_cn if master_should_connect == 'y' else (icinga_master_cn ~ ',' ~ icinga_master_host ~ ',' ~ icinga_master_port) }}"

  tasks:
    - name: Download Icinga 2 MSI
      ansible.windows.win_get_url:
        url: "{{ icinga2_windows_msi_url }}"
        dest: "{{ icinga2_msi_path }}"

    - name: Install Icinga 2
      ansible.windows.win_package:
        path: "{{ icinga2_msi_path }}"
        state: present
        arguments: /qn /norestart
        expected_return_code: [0, 3010]

    - name: Ensure certificate directory exists
      ansible.windows.win_file:
        path: "{{ icinga_cert_dir }}"
        state: directory

    - name: Fetch trusted certificate from Icinga master
      ansible.windows.win_command:
        argv:
          - "{{ icinga2_exe }}"
          - pki
          - save-cert
          - --host
          - "{{ icinga_master_host }}"
          - --port
          - "{{ icinga_master_port }}"
          - --trustedcert
          - "{{ icinga_cert_dir }}\\trusted-parent.crt"
        creates: "{{ icinga_cert_dir }}\\trusted-parent.crt"

    - name: Run icinga2 node setup with Director ticket
      ansible.windows.win_command:
        argv:
          - "{{ icinga2_exe }}"
          - node
          - setup
          - --ticket
          - "{{ icinga_ticket }}"
          - --cn
          - "{{ inventory_hostname }}"
          - --zone
          - "{{ inventory_hostname }}"
          - --endpoint
          - "{{ icinga_parent_endpoint }}"
          - --parent_host
          - "{{ icinga_master_host }}"
          - --parent_zone
          - "{{ cluster_zone }}"
          - --trustedcert
          - "{{ icinga_cert_dir }}\\trusted-parent.crt"
          - --accept-commands
          - --accept-config
          - --disable-confd
          - --global_zones
          - director-global
        creates: "{{ icinga_cert_dir }}\\{{ inventory_hostname }}.crt"
      notify: Restart icinga2

    - name: Enable and start icinga2
      ansible.windows.win_service:
        name: icinga2
        start_mode: auto
        state: started

  handlers:
    - name: Restart icinga2
      ansible.windows.win_service:
        name: icinga2
        state: restarted
